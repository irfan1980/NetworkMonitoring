# Dashboard (dashboard/): Expo SDK 57 app, built as its static web export (expo export --platform web -> dist/).
# Deployed into /home/site/wwwroot/dashboard of the one App Service, devmonitoringApp (same azure/webapps-deploy
# action, slot and publish-profile secret as before). The gateway serves that folder from disk, so the app is
# not restarted and the relay keeps running. The page talks to the relay on its own origin (/api, /ws).
# Layout and App Service settings: docs/github-actions.md

name: Build and deploy Dashboard (Expo web) to Azure Web App - devmonitoringApp

on:
  push:
    branches:
      - 'Development'
    paths:
      - 'dashboard/**'
      - '.github/workflows/development_dashboard.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout
    defaults:
      run:
        working-directory: dashboard
    env:
      # EXPO_PUBLIC_RELAY_WS_URL is left unset on purpose: the web build then derives ws(s)://<page host>/ws
      EXPO_PUBLIC_FIXTURE: '0'

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node version
        uses: actions/setup-node@v5
        with:
          node-version: '24.x' # package.json engines: node >=24.12
          cache: 'yarn'
          cache-dependency-path: dashboard/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Type check
        run: yarn typecheck

      - name: Build web export
        run: npx expo export --platform web --output-dir dist --clear

      - name: Package dashboard
        run: |
          test -f dist/index.html
          (cd dist && zip -qr ../dashboard.zip .)

      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v6
        with:
          name: dashboard-web
          path: dashboard/dashboard.zip
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build
    # both workflows deploy to the one app: take turns (builds still run in parallel)
    concurrency:
      group: azure-deploy-devmonitoringApp
      cancel-in-progress: false

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v7
        with:
          name: dashboard-web

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'devmonitoringApp'
          slot-name: 'Development'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_21FA5A948323482DA2875B8A95BDD27D }}
          package: dashboard.zip
          type: zip
          target-path: /home/site/wwwroot/dashboard
          restart: false
